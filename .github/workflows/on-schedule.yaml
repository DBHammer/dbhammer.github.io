name: on-schedule
run-name: on schedule

on:
  schedule:
    # weekly
    - cron: "0 0 * * 1"

  # run if user manually requests it
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-citations:
    # 已停用: 论文列表由 _data/citations.yaml 手工维护, 不再自动生成
    if: false
    uses: ./.github/workflows/update-citations.yaml
    with:
      open-pr: true
