name: on-push
run-name: on push to main

on:
  push:
    branches:
      - main

  # run if user manually requests it
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # 论文列表由 _data/citations.yaml 手工维护, 已停用自动生成 (update-citations)
  build-site:
    uses: ./.github/workflows/build-site.yaml
