name: on-pull-request
run-name: on pull request activity

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: write
  pull-requests: write

jobs:
  # 论文列表由 _data/citations.yaml 手工维护, 已停用自动生成 (update-citations)
  build-preview:
    uses: ./.github/workflows/build-preview.yaml
